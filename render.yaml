# Render Blueprint — free tier (no persistent disk)
# SQLite survives restarts via Cloudflare R2 (or any S3-compatible bucket) — see DEPLOYMENT.md

services:
  - type: web
    name: the-method-casinos
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm run start:prod
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"

      # Set once in dashboard — keep stable across deploys
      - key: SESSION_SECRET
        sync: false

      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false

      - key: PUBLIC_SITE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: API_URL
        sync: false

      - key: DISCORD_INVITE_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_LIVE_FEED_WEBHOOK_URL
        sync: false

      - key: DISCORD_LIVE_FEED
        value: "true"
      - key: DISCORD_NOTIFY_PENDING
        value: "false"

      - key: SESSION_MAX_AGE_DAYS
        value: "30"

      # Cloudflare R2 (free) — required for data to survive Render restarts
      - key: REMOTE_DB_SYNC
        value: "true"
      - key: REMOTE_DB_SYNC_INTERVAL_MINUTES
        value: "3"
      - key: REMOTE_DB_SYNC_DEBOUNCE_SEC
        value: "8"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_OBJECT_KEY
        value: casinos.db

      - key: REVALIDATE_INTERVAL_HOURS
        value: "168"
      - key: REVALIDATE_BATCH_SIZE
        value: "8"

      - key: DISCOVERY_CONTINUOUS
        value: "true"
      - key: DISCOVERY_CONTINUOUS_COOLDOWN_SEC
        value: "90"
      - key: DISCOVERY_CONTINUOUS_BOOT_DELAY_SEC
        value: "45"
