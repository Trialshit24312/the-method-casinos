# Render Blueprint — https://github.com/Trialshit24312/the-method-casinos
# 100% free stack: Discord + SQLite + free web search (no Serper/AI API keys)

services:
  - type: web
    name: the-method-casinos
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm run start:prod
    healthCheckPath: /health
    disk:
      name: casino-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: API_URL
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_LIVE_FEED
        value: "true"
      - key: DISCORD_FEED_CHANNEL_ID
        sync: false
      - key: DISCORD_LIVE_FEED_PIN
        value: "true"
      - key: REVALIDATE_INTERVAL_HOURS
        value: "168"
      - key: SESSION_MAX_AGE_DAYS
        value: "30"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: DISCOVERY_CONTINUOUS
        value: "true"
      - key: DISCOVERY_CONTINUOUS_COOLDOWN_SEC
        value: "90"
      - key: DB_BACKUP_INTERVAL_HOURS
        value: "24"
