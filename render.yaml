# Render Blueprint — https://github.com/Trialshit24312/the-method-casinos

services:
  - type: web
    name: the-method-casinos
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm run start:prod
    healthCheckPath: /health
    disk:
      name: casino-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: API_URL
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
