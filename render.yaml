# Render Blueprint — https://github.com/Trialshit24312/the-method-casinos
# New Blueprint → connect repo → Render reads render.yaml from main.

services:
  - type: web
    name: the-method-casinos
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build:all
    startCommand: npm run start:prod
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: API_URL
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
